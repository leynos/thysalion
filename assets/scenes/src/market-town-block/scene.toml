# The Town district scene class (design section 7.1, Table 1), of which one
# populated block: cobbled street, timber-framed facades, tiled roofs, a well,
# stalls under awnings, and banners.
#
# Palette band: Market Town — warm and inviting. Lighting: late-afternoon sun.
#
# The declared extent is 512 x 512 and the content box is 24 x 20. That ratio is
# the point of `content_origin` and `content_extent`: a raster covering the
# declared extent would be a quarter of a megabyte of text per layer, and 99.8
# per cent of it would be air that nobody authored.
#
# The origin is deliberately *not* chunk-aligned. Every other fixture's content
# happens to fall inside one 32-cube, so without this one nothing shipped would
# exercise a content box straddling a chunk boundary — and the multi-chunk sort
# order, which the canonical encoding and therefore the content hash depend on,
# would be tested only by the generator's own suite.

[scene]
name = "market-town-block"
dimensions = [512, 512, 96]
chunk_size = 32
content_origin = [110, 120, 0]
content_extent = [24, 20, 7]

[[palette]]
name = "air"
material = "air"
passable = true

[[palette]]
