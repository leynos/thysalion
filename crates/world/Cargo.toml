[package]
name = "thysalion-world"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Thysalion state plane: voxel grid, scene documents, and palettes"

[dependencies]
blake3 = { workspace = true }
camino = { workspace = true }
# A runtime dependency, not just a test one: `DirSceneSource` is the shipped
# filesystem adapter, and AGENTS.md's filesystem policy requires it to hold a
# directory capability rather than reach for ambient authority.
cap-std = { workspace = true }
rmp-serde = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
smol_str = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }
rmpv = { workspace = true }
rstest = { workspace = true }
rstest-bdd = { workspace = true }
rstest-bdd-harness = { workspace = true }
rstest-bdd-macros = { workspace = true }
smol_str = { workspace = true }

[[test]]
name = "loading"
path = "tests/loading/main.rs"
harness = true

[lints]
workspace = true
