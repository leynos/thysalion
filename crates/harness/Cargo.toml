[package]
name = "thysalion-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Thysalion demo harness: shared scaffolding for capability demonstrations"

[dependencies]
bevy = { workspace = true }
camino = { workspace = true }
cap-std = { workspace = true }
thysalion-presentation = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rstest = { workspace = true }
rstest-bdd = { workspace = true }
rstest-bdd-harness = { workspace = true }
rstest-bdd-macros = { workspace = true }
# The `bevy` feature carries the promoted `BevyHarness` adapter; this crate is
# where the app half of the test-support crate is actually exercised.
thysalion-test-support = { workspace = true, features = ["bevy"] }
trybuild = { workspace = true }

[lints]
workspace = true
