# Align with CodeScene’s ceiling
cognitive-complexity-threshold = 9     # default is 25
too-many-arguments-threshold = 4       # default is 7
too-many-lines-threshold = 70          # default is 100
excessive-nesting-threshold = 4        # default is off

allow-expect-in-tests = true

# Proper nouns that `clippy::doc_markdown` mistakes for code items because
# they are camel-cased. The trailing `..` extends Clippy's default list rather
# than replacing it. Backticking these in prose would be wrong: they name
# formats and projects, not identifiers.
doc-valid-idents = ["MessagePack", "MagicaVoxel", "OpenVDB", "TriG", "VoxelForge", ".."]

