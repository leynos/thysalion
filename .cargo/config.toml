# Repository-wide Cargo defaults for the development build standard.
#
# The parallel `rustc` frontend is the default for every build, and the mold
# linker is the default on Linux. Cargo auto-discovers this file, so a bare
# `cargo build` gets both. Coverage and release builds assign `RUSTFLAGS`,
# which displaces every `rustflags` source below, so neither takes them.
#
# Cargo selects a single `rustflags` source rather than merging them: a
# matching `[target.*]` table replaces `[build] rustflags` outright. Every flag
# is therefore repeated in each source, and the Makefile restates them where it
# assigns `RUSTFLAGS` for the gate targets.

# No `codegen-backend` key belongs here: release.yml builds with
# `cross +stable`, and stable Cargo refuses a configuration that names one
# ("feature `codegen-backend` is required"). Development builds therefore
# stay on LLVM; `tests/stable_release_config.rs` holds this.

[build]
rustflags = ["-Zthreads=8"]

# mold ships for Linux only, so the linker flag is confined to Linux targets.
# The table is keyed on the operating system rather than one triple, so every
# Linux architecture links with mold; Cargo honours `linker` in a `cfg` table.
# Other platforms fall through to `[build] rustflags` and their default linker.
[target.'cfg(target_os = "linux")']
linker = "clang"
rustflags = ["-Zthreads=8", "-C", "link-arg=-fuse-ld=mold"]
