
name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      # 0.2.7 ships the lint suite built for the repository's pinned
      # toolchain (nightly-2026-05-28); older suites cannot compile Bevy 0.19
      # (rustc >= 1.95 required). 0.2.7 also removed the --cranelift flag.
      WHITAKER_INSTALLER_VERSION: '0.2.7'
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@6b5cdc2d4c0bb72cafd5a66d24d248ac25827db9
      - name: Install mold linker
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # mold accelerates dev builds; coverage uses lld for llvm-tools compatibility.
          sudo apt-get update \
            && sudo apt-get install --yes --no-install-recommends clang lld mold
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@c5a54701c8603a0fa756a6b34c49bc2af75a6c11
        with:
          version: "0.6.0"

      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@0d13344ea8b610217b17922d841a583b4f3a6427
        with:
          globs: '**/*.md'
      - name: Setup uv
        uses: astral-sh/setup-uv@c6081965dd0577ae48820cb8c288e12509571f0c
      - name: Check spelling
        run: make spelling
      # The pytest suite for the Python helper scripts under `scripts/`,
      # chiefly the fixture-scene generator behind `make scenes`.
      - name: Test the Python helper scripts
        run: make scripts-test
      - name: Install test runner
        env:
          RUSTFLAGS: ""
        run: cargo binstall --no-confirm --locked cargo-nextest
      - name: Install cargo-audit
        env:
          RUSTFLAGS: ""
        run: cargo binstall --no-confirm cargo-audit
      - name: Setup Python for audit manifest extraction
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'
      - name: Cache Whitaker installation
        id: cache-whitaker
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/bin/whitaker-installer
            ~/.local/bin/whitaker
            ~/.dylint_drivers
            ~/.local/share/whitaker
          key: whitaker-v3-${{ runner.os }}-${{ env.WHITAKER_INSTALLER_VERSION }}
      - name: Install Whitaker
        env:
          RUSTFLAGS: ""
          WHITAKER_CACHE_HIT: ${{ steps.cache-whitaker.outputs.cache-hit }}
        run: |
          set -euo pipefail
          echo "Whitaker cache hit: ${WHITAKER_CACHE_HIT}"
          if [ "${WHITAKER_CACHE_HIT}" != "true" ]; then
            echo "Installing whitaker-installer ${WHITAKER_INSTALLER_VERSION}"
            cargo binstall --no-confirm --locked \
              whitaker-installer@"${WHITAKER_INSTALLER_VERSION}"
          fi
          whitaker-installer
          echo "Whitaker binary: $(command -v whitaker || true)"
      - name: Audit dependencies
        run: make audit
      - name: Lint
        run: make lint
      - name: Log coverage linker configuration
        run: |
          echo "Coverage linker: clang"
          echo "Coverage RUSTFLAGS: -C link-arg=-fuse-ld=lld"
          echo "Coverage CFLAGS: -fuse-ld=lld"
          echo "Coverage LDFLAGS: -fuse-ld=lld"
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          RUSTFLAGS: -C link-arg=-fuse-ld=lld
          CFLAGS: -fuse-ld=lld
          LDFLAGS: -fuse-ld=lld
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
          # The publisher in coverage-main.yml owns the coverage artefact and
          # the ratchet baseline; this lane only compares against it.
          publish-artefact: 'false'
          # `make test` runs with --all-features, and the demo-empty bin's
          # tests build only with its feature (required-features), so
          # coverage names it to select the same tests.
          features: thysalion-demos/demo-empty
      # The doctests are the only part of `make test` the coverage step does
      # not run. The flags are the ones `make test` gives its doctest line.
      # tests/workflow_suite_contract.rs holds the split.
      - name: Run doctests
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --doc --workspace --all-features
