name: Coverage (main)

# This workflow is the repository's only CodeScene caller. CodeScene
# accepts `cs-coverage upload` only for analysed branches, so main-branch
# coverage is uploaded here; pull requests generate coverage in ci.yml for
# their own ratchet and never receive the token or contact CodeScene. This
# workflow also advances the coverage ratchet baseline: caches saved on main
# are readable by every pull-request run, so the baseline written here is the
# one a pull request's ratchet compares against.
#
# An existing manual dispatch can measure and upload main coverage, but the
# coverage action advances the ratchet baseline only on a push to main. The
# token belongs to the main-only `codescene` environment declared by this job.

'on':
  push:
    branches: [main]
  workflow_dispatch:

# Publishers queue rather than race or cancel. Runs in the group never
# overlap, and a newer trigger replaces an older pending run; nothing here
# promises that runs start in commit order. The coverage action saves the
# ratchet baseline only on a push, so a dispatch uploads coverage but leaves
# the baseline where the last completed push left it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    # CS_ACCESS_TOKEN is a secret of this environment, which admits main
    # alone, so no other ref can reach the token.
    environment: codescene
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@6cec89bac47a21cf756d68d638a9a510998e57f8
        with:
          expect-cache: any
      - name: Install coverage linker prerequisites
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # Coverage uses lld for llvm-tools compatibility.
          sudo apt-get update \
            && sudo apt-get install --yes --no-install-recommends clang lld
      - name: Install test runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUSTFLAGS: ""
        run: cargo binstall --no-confirm --locked cargo-nextest
      - name: Check build tools
        run: make install-build-tools
      - name: Log coverage linker configuration
        run: |
          echo "Coverage linker: clang"
          echo "Coverage RUSTFLAGS: -C link-arg=-fuse-ld=lld"
          echo "Coverage CFLAGS: -fuse-ld=lld"
          echo "Coverage LDFLAGS: -fuse-ld=lld"
      # The coverage action does not clear encoded rustflags, which take
      # precedence over RUSTFLAGS and could reactivate development settings.
      - name: Check coverage flag isolation
        run: |
          if [ "${CARGO_ENCODED_RUSTFLAGS+x}" = x ]; then
            echo 'CARGO_ENCODED_RUSTFLAGS must be unset for coverage' >&2
            exit 1
          fi
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@d4d248bbbecdcf7b4f5bc79ffd4d6caee370bd79
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          CARGO_UNSTABLE_CODEGEN_BACKEND: 'true'
          CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
          CARGO_PROFILE_DEV_BUILD_OVERRIDE_CODEGEN_BACKEND: llvm
          CARGO_PROFILE_TEST_BUILD_OVERRIDE_CODEGEN_BACKEND: llvm
          RUSTFLAGS: -C link-arg=-fuse-ld=lld
          CFLAGS: -fuse-ld=lld
          LDFLAGS: -fuse-ld=lld
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
          # `make test` runs with --all-features, and the demo-empty bin's
          # tests build only with its feature (required-features), so
          # coverage names it to select the same tests.
          features: thysalion-demos/demo-empty
      # Publishes whether the token exists, and nothing else. The token is in
      # no `env` on this workflow: the upload is a composite action whose
      # nested steps inherit the calling step's `env`. GitHub evaluates the
      # expression before it sends the command to the runner, so this shell
      # receives only `true` or `false`; the upload alone receives the token,
      # as its input.
      - name: Check CodeScene token
        id: codescene-token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      # The ref guard is not redundant with the push branch filter: a
      # dispatch runs from whichever branch started it, and the upload action
      # does not check the ref itself.
      - name: Upload coverage data to CodeScene
        if: steps.codescene-token.outputs.available == 'true' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@d4d248bbbecdcf7b4f5bc79ffd4d6caee370bd79
        # No checksum input: the uploader pins cs-coverage through its own
        # manifest and rejects a non-empty `installer-checksum`.
        with:
          format: lcov
          mode: upload
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
