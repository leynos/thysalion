
name: Release Binary

on:
  push:
    tags:
      - 'v*.*.*'

env:
  BIN_NAME: thysalion
  CROSS_REVISION: 88f49ff79e777bef6d3564531636ee4d3cc2f8d2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - os: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: linux
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            ext: ""
          - os: windows
            arch: x86_64
            target: x86_64-pc-windows-gnu
            ext: ".exe"
          - os: macos
            arch: x86_64
            target: x86_64-apple-darwin
            ext: ""
          - os: macos
            arch: aarch64
            target: aarch64-apple-darwin
            ext: ""
          - os: freebsd
            arch: x86_64
            target: x86_64-unknown-freebsd
            ext: ""
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: leynos/shared-actions/.github/actions/setup-rust@6cec89bac47a21cf756d68d638a9a510998e57f8
        with:
          expect-cache: any
          toolchain: stable
      - name: Cache cross binary
        id: cache-cross
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cargo/bin/cross
          key: cross-${{ env.CROSS_REVISION }}
      - name: Install cross
        env:
          # Install the pinned release tool with stable Cargo outside the
          # repository's nightly development configuration.
          RUSTFLAGS: ""
        run: |
          if [ -x "$HOME/.cargo/bin/cross" ]; then
            exit 0
          fi
          unset CARGO_ENCODED_RUSTFLAGS CARGO_UNSTABLE_CODEGEN_BACKEND
          unset CARGO_PROFILE_DEV_CODEGEN_BACKEND CARGO_PROFILE_DEV_BUILD_OVERRIDE_CODEGEN_BACKEND
          unset CARGO_PROFILE_TEST_CODEGEN_BACKEND CARGO_PROFILE_TEST_BUILD_OVERRIDE_CODEGEN_BACKEND
          unset CARGO_PROFILE_RELEASE_CODEGEN_BACKEND CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_CODEGEN_BACKEND
          unset CARGO_PROFILE_BENCH_CODEGEN_BACKEND CARGO_PROFILE_BENCH_BUILD_OVERRIDE_CODEGEN_BACKEND
          cd /
          cargo +stable install cross --git https://github.com/cross-rs/cross --rev "${CROSS_REVISION}"
      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
      - name: Build release binary
        # Cross uses stable Cargo for releases; the pinned nightly remains for
        # development, whose backend is LLVM under the documented exception.
        env:
          # An empty value excludes development rustflags. Stable Cargo reads
          # the checkout config, so it must omit unsupported backend keys.
          # Run from outside the tree and select the same manifest explicitly.
          RUSTFLAGS: ""
          # Cross forwards Cargo target variables into its images. Override
          # the repository's Linux clang linker with each image's GCC linker.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        # -p thysalion is load-bearing: demo crates (thysalion-demos and the
        # Bevy-dependent harness) must never enter the release build graph —
        # they do not cross-compile for these targets. A workflow-shape test
        # (tests/workflow_shape.rs) asserts this flag stays present.
        run: |
          unset CARGO_ENCODED_RUSTFLAGS CARGO_UNSTABLE_CODEGEN_BACKEND
          unset CARGO_PROFILE_DEV_CODEGEN_BACKEND CARGO_PROFILE_DEV_BUILD_OVERRIDE_CODEGEN_BACKEND
          unset CARGO_PROFILE_TEST_CODEGEN_BACKEND CARGO_PROFILE_TEST_BUILD_OVERRIDE_CODEGEN_BACKEND
          unset CARGO_PROFILE_RELEASE_CODEGEN_BACKEND CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_CODEGEN_BACKEND
          unset CARGO_PROFILE_BENCH_CODEGEN_BACKEND CARGO_PROFILE_BENCH_BUILD_OVERRIDE_CODEGEN_BACKEND
          cd /
          cross +stable build --manifest-path "${GITHUB_WORKSPACE}/Cargo.toml" \
            --release -p thysalion --target ${{ matrix.target }}
      - name: Prepare artifact
        run: |
          mkdir -p artifacts/${{ matrix.os }}-${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/${{ env.BIN_NAME }}${{ matrix.ext }} \
            artifacts/${{ matrix.os }}-${{ matrix.arch }}/${{ env.BIN_NAME }}-${{ matrix.target }}${{ matrix.ext }}
          cd artifacts/${{ matrix.os }}-${{ matrix.arch }}
          sha256sum ${{ env.BIN_NAME }}-${{ matrix.target }}${{ matrix.ext }} > \
            ${{ env.BIN_NAME }}-${{ matrix.target }}${{ matrix.ext }}.sha256
      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/${{ matrix.os }}-${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          path: artifacts
      - uses: softprops/action-gh-release@403a5240f3837fa857f642062e05aad6bb3391ca
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          generate_release_notes: true
          files: |
            artifacts/*/*
