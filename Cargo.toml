[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "ISC"
repository = "https://github.com/leynos/thysalion"

# Shared dependency pins. `[workspace.dependencies]` is the single source of
# truth for version literals (see docs/adr-005-workspace-crate-layout.md).
# The bevy feature list is curated: umbrella features (`2d`, `3d`, `ui`)
# hard-include gamepad (libudev) and Wayland system dependencies, so the
# fine-grained set below composes 3-D PBR rendering, UI text, PNG
# screenshots, and X11 windowing without any system-dev-header requirement.
[workspace.dependencies]
thysalion-presentation = { path = "crates/presentation" }
thysalion-harness = { path = "crates/harness" }
bevy = { version = "0.19", default-features = false, features = [
  "default_app",
  "std",
  "multi_threaded",
  "bevy_winit",
  "x11",
  "default_font",
  "keyboard",
  "mouse",
  "common_api",
  "bevy_light",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_pbr",
  "tonemapping_luts",
  "ktx2",
  "zstd_rust",
  "ui_api",
  "ui_bevy_render",
  "png",
] }
cap-std = { version = "3", features = ["fs_utf8"] }
camino = "1"
rstest = "0.26"
proptest = "1"
trybuild = "1"
rstest-bdd = "0.6.0-beta3"
rstest-bdd-macros = "0.6.0-beta3"
rstest-bdd-harness = "0.6.0-beta3"

[package]
name = "thysalion"
version.workspace = true
edition.workspace = true
description = "Voxels. Everywhere."
license.workspace = true
repository.workspace = true
homepage = "https://github.com/leynos/thysalion"
readme = "README.md"
keywords = ["game"]
categories = ["game"]

[dependencies]

[dev-dependencies]
cap-std = { workspace = true }
camino = { workspace = true }

# The package.metadata.binstall pkg-url intentionally mixes Jinja2 values
# rendered at project generation with single-brace cargo-binstall variables
# substituted at install time.
[package.metadata.binstall]
pkg-url = "https://github.com/leynos/thysalion/releases/download/v{ version }/thysalion-{ target }{ binary-ext }"
pkg-fmt = "bin"
disabled-strategies = ["quick-install", "compile"]

[lints]
workspace = true

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# 1. hygiene
allow_attributes                    = "deny"
allow_attributes_without_reason     = "deny"
blanket_clippy_restriction_lints    = "deny"
cognitive_complexity                = "deny"
needless_pass_by_value              = "deny"
implicit_hasher                     = "deny"

# 2. debugging leftovers
dbg_macro                           = "deny"
print_stdout                        = "deny"
print_stderr                        = "deny"

# 2. panic-prone operations
unwrap_used                         = "deny"
expect_used                         = "deny"
indexing_slicing                    = "deny"
string_slice                        = "deny"
integer_division                    = "deny"
integer_division_remainder_used     = "deny"
panic_in_result_fn                  = "deny"
unreachable                         = "deny"

# 4. portability
host_endian_bytes                   = "deny"
little_endian_bytes                 = "deny"
big_endian_bytes                    = "deny"

# 5. nursery idiom polish
let_underscore_must_use             = "deny"
or_fun_call                         = "deny"
option_if_let_else                  = "deny"
self_named_module_files             = "deny"
shadow_reuse                        = "deny"
shadow_same                         = "deny"
shadow_unrelated                    = "deny"
str_to_string                       = "deny"
string_lit_as_bytes                 = "deny"
try_err                             = "deny"
unneeded_field_pattern              = "deny"
use_self                            = "deny"

# 6. numerical foot-guns
float_arithmetic                    = "deny"
cast_possible_truncation            = "deny"
cast_possible_wrap                  = "deny"
cast_precision_loss                 = "deny"
lossy_float_literal                 = "deny"

# 7. API ergonomics
missing_const_for_fn                = "deny"
must_use_candidate                  = "deny"
unused_async                        = "deny"

# 8. Error handling
missing_panics_doc                  = "deny"
error_impl_error                    = "deny"
result_large_err                    = "deny"

[workspace.lints.rust]
missing_docs                        = "deny"
# `coverage_nightly` is set by cargo-llvm-cov; it gates the `#[coverage(off)]`
# boundary that keeps windowed-only code out of the coverage ratchet.
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(coverage_nightly)"] }

[workspace.lints.rustdoc]
missing_crate_level_docs            = "deny"
